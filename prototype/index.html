<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cat Board Game — Vertical Slice</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #14161c; color: #e6e6e6; overflow: hidden; }
  #app { height: 100vh; }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
  .note { color: #9aa0ab; font-size: 0.85rem; max-width: 640px; }
  button { font-size: 0.95rem; padding: 0.45rem 0.9rem; margin: 0.2rem 0.4rem 0.2rem 0; cursor: pointer; border-radius: 4px; border: 1px solid #444; background: #262a33; color: #e6e6e6; }
  button:hover:not(:disabled) { background: #323744; }
  button:disabled { opacity: 0.4; cursor: default; }
  textarea { width: 100%; max-width: 400px; font-family: inherit; background: #1c1f27; color: #e6e6e6; border: 1px solid #444; border-radius: 4px; padding: 0.4rem; }
  input[type="text"], select { font-family: inherit; font-size: 0.95rem; background: #1c1f27; color: #e6e6e6; border: 1px solid #444; border-radius: 4px; padding: 0.35rem 0.5rem; }
  .setupWrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .setup { display: flex; flex-direction: column; gap: 0.6rem; width: 440px; max-width: 100%; }
  .modePick { display: flex; gap: 0.5rem; }
  .modeBtn { flex: 1; margin: 0; padding: 0.6rem; }
  .modeBtn.sel { background: #3a5cff22; border-color: #6b8aff; color: #cdd8ff; }
  .playerSetupRow { display: flex; gap: 0.5rem; margin-bottom: 0.4rem; align-items: center; }
  .playerSetupRow input[type="text"] { flex: 1; }
  .botToggle { font-size: 0.8rem; color: #9aa0ab; white-space: nowrap; display: flex; align-items: center; gap: 0.25rem; }
  .botTag { font-size: 0.7rem; padding: 0.05rem 0.35rem; border-radius: 3px; margin-left: 0.3rem; background: #2b3d5a; color: #a8c4ea; }
  .muted { color: #9aa0ab; }

  /* --- Menu + sub-screens --- */
  .menuWrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; overflow-y: auto; }
  .menu { width: 380px; max-width: 100%; text-align: center; }
  .menuBtns { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 1.4rem; }
  .menuBtn { margin: 0; padding: 0.75rem; font-size: 1rem; }
  .menuBtn.big { padding: 1rem; font-size: 1.15rem; background: #2f4a2f; border-color: #4a7a4a; }
  .screenCard { width: 560px; max-width: 100%; }
  .screenCard.wide { width: 840px; }
  .screenHead { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  .screenHead h1 { font-size: 1.25rem; margin: 0; }
  .backBtn { margin: 0; }
  .shopGrid, .statGrid, .invGrid { display: grid; gap: 0.6rem; margin-top: 0.75rem; }
  .shopGrid { grid-template-columns: repeat(2, 1fr); }
  .shopItem { border: 1px solid #333; border-radius: 8px; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; background: #1c1f27; }
  .shopItem button { margin: 0.25rem 0 0; }
  .statGrid > div, .invGrid > div { border: 1px solid #333; border-radius: 8px; padding: 0.6rem 0.75rem; display: flex; justify-content: space-between; gap: 1rem; background: #1c1f27; }

  /* --- Deck screen --- */
  .classPick { display: flex; gap: 0.5rem; margin: 0.5rem 0 1rem; }
  .classBtn { flex: 1; margin: 0; }
  .classBtn.sel { background: #3a5cff22; border-color: #6b8aff; color: #cdd8ff; }
  .cardGrid { display: grid; grid-template-columns: repeat(auto-fill, 108px); gap: 0.5rem; margin-bottom: 0.75rem; }
  .deckFoot { margin-top: 1rem; }

  /* --- Card component --- */
  .card { position: relative; width: 108px; aspect-ratio: 3 / 4; border-radius: 8px; background-size: 100% 100%; background-repeat: no-repeat;
          border: 1px solid #3a3f4b; background-color: #20242e; display: flex; flex-direction: column; align-items: center;
          justify-content: flex-end; padding: 6px; overflow: hidden; }
  .card.small { width: 74px; }
  .card.card-attack { box-shadow: inset 0 0 0 2px #7a3b3b55; }
  .card.card-guard { box-shadow: inset 0 0 0 2px #3b567a55; }
  .card.playable { cursor: pointer; }
  .card.playable:hover { transform: translateY(-6px); border-color: #8aa0ff; }
  .cardVal { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 1.05rem;
             color: #fff; text-shadow: 0 1px 3px #000; background: rgba(0,0,0,0.35); border-radius: 999px; min-width: 1.5rem; text-align: center; padding: 0 4px; }
  .card.small .cardVal { font-size: 0.85rem; }
  .cardName { font-size: 0.62rem; line-height: 1.15; text-align: center; color: #f0f0f0; text-shadow: 0 1px 2px #000;
              background: rgba(0,0,0,0.4); border-radius: 4px; padding: 2px 3px; width: 100%; }
  .card.small .cardName { font-size: 0.5rem; }

  /* --- Battle scene --- */
  #menuBtn { position: fixed; top: 8px; right: 8px; z-index: 20; opacity: 0.55; }
  #menuBtn:hover { opacity: 1; }
  .battleScene { min-height: 100vh; max-width: 900px; margin: 0 auto; padding: 3rem 1rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .battleTop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; }
  .fighter { border: 1px solid #333; border-radius: 10px; padding: 0.75rem 1rem; background: #1c1f27; }
  .fighter.active { border-color: #4a7a4a; box-shadow: 0 0 0 1px #4a7a4a55; }
  .fighterHead { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
  .fighterName { font-weight: 700; }
  .hpTrack { position: relative; height: 20px; border-radius: 999px; background: #2a2f3a; overflow: hidden; }
  .hpFill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #e0674f, #81b29a); transition: width 0.3s; }
  .hpNum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; text-shadow: 0 1px 2px #000; }
  .deckMeta { display: flex; gap: 0.75rem; font-size: 0.75rem; color: #9aa0ab; margin-top: 0.4rem; }
  .vsBadge { font-weight: 800; color: #9aa0ab; letter-spacing: 0.1em; }
  .battleMid { display: flex; align-items: center; justify-content: center; gap: 1.5rem; min-height: 190px; }
  .tableWrap { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .tableWrap.empty { border: 2px dashed #333; border-radius: 10px; padding: 2.5rem 3rem; }
  .battleTimer { font-size: 1.1rem; color: #cdd3dc; }
  .battleAction { text-align: center; }
  .battleAction h3 { margin: 0 0 0.6rem; }
  .hand { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .actBtns { display: flex; gap: 0.5rem; justify-content: center; }
  .takeHit { border-color: #7a5a3b; }
  .battleBar { display: flex; gap: 0.5rem; justify-content: center; }
  .handStrip { margin-top: auto; border-top: 1px solid #2a2f3a; padding-top: 0.6rem; }
  .handStripCards { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.35rem; }
  .battleLog { margin-top: 0.5rem; border: 1px solid #333; border-radius: 6px; padding: 0.5rem 0.75rem; max-height: 160px; overflow-y: auto;
               font-family: ui-monospace, monospace; font-size: 0.75rem; color: #aab; background: #14161c; }
  .layout { display: flex; gap: 0; align-items: stretch; height: 100vh; }
  .left { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; }
  .right { width: 340px; flex-shrink: 0; height: 100vh; overflow-y: auto; padding: 16px 16px 60px; border-left: 1px solid #333; background: #14161c; }
  .right.collapsed { width: 0; padding: 0; overflow: hidden; border: 0; }
  #fsBtn { position: fixed; bottom: 10px; left: 10px; z-index: 20; opacity: 0.5; }
  #fsBtn:hover { opacity: 1; }
  #panelBtn { position: fixed; bottom: 10px; left: 118px; z-index: 20; opacity: 0.5; }
  #panelBtn:hover { opacity: 1; }
  .board { display: grid; gap: 0; border: 1px solid #333; --cell: 32px; }
  .tile { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center; font-size: 9px; background-repeat: no-repeat; background-position: center; background-size: cover; }
  .tile.obstacle { background: #14170f; }
  .tile.path { background: #5c6b3f; }
  .tile.ring { background: #8a7a3a; }
  .tile.townCenter { background: #2a3348; }
  .tile.townCenter.tc-door { background: #e8c060; }
  .tile.entry-townCenter { background: #c9954a; }
  .tile.blacksmith { background: #5a3d2b; }
  .tile.inn { background: #3d5a3f; }
  .tile.church { background: #4a4a6a; }
  .tile.entry-blacksmith { background: #8a6a4a; }
  .tile.entry-inn { background: #6a9a6e; }
  .tile.entry-church { background: #7a7aae; }
  .tile.hazard-poison { background: #4a6a2a; }
  .tile.hazard-thorn { background: #6a3a2a; }
  .tile.fountain { background: #2b5a5a; }
  .tile.yarnEmporium { background: #6a2b5a; }
  .tile.fishMarket { background: #2b4a6a; }
  .tile.catnipGarden { background: #4a6a2b; }
  .tile.entry-fountain { background: #4a9a9a; }
  .tile.entry-yarnEmporium { background: #a45aa4; }
  .tile.entry-fishMarket { background: #5a8aca; }
  .tile.entry-catnipGarden { background: #8aca5a; }
  .token { display: inline-block; width: calc(var(--cell, 32px) * 0.64); height: calc(var(--cell, 32px) * 0.64); border-radius: 50%; text-align: center; line-height: calc(var(--cell, 32px) * 0.64); font-size: calc(var(--cell, 32px) * 0.4); font-weight: bold; color: #14161c; margin: 1px; }
  .token.art { border-radius: 50%; background-size: contain; background-position: center bottom; background-repeat: no-repeat; background-color: rgba(255,255,255,0.82); box-shadow: 0 0 0 2px rgba(0,0,0,0.35); }
  .players { margin-bottom: 0.75rem; }
  .playerRow { padding: 0.15rem 0; }
  .playerRow.dead { opacity: 0.4; text-decoration: line-through; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.4rem; }
  .allianceTag { color: #9aa0ab; font-size: 0.8rem; }
  .statusTag { font-size: 0.75rem; padding: 0.05rem 0.4rem; border-radius: 3px; margin-left: 0.3rem; }
  .statusTag.poisoned { background: #3d5a2b; color: #b8e0a0; }
  .statusTag.snared { background: #5a3d2b; color: #e0c0a0; }
  .statusTag.grace { background: #2b3d5a; color: #a0c0e0; }
  .controls { border: 1px solid #444; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; background: #1c1f27; }
  .log { border: 1px solid #333; border-radius: 6px; padding: 0.5rem 0.75rem; max-height: 220px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 0.8rem; background: #14161c; }
  .battlePanel { margin-top: 0.5rem; font-size: 0.85rem; color: #cfd3da; }
  .battleLog { max-height: 100px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 0.72rem; color: #7c8290; }
  .withdrawRow { margin-top: 0.5rem; }
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
