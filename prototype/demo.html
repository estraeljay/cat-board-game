<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cat Board Game — Combat/PvP Prototype (isolated demo)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; background: #14161c; color: #e6e6e6; }
  h1 { font-size: 1.3rem; }
  button { font-size: 1rem; padding: 0.5rem 1rem; margin-right: 0.5rem; cursor: pointer; }
  #log { margin-top: 1rem; border: 1px solid #444; border-radius: 6px; padding: 0.75rem; background: #1c1f27; }
  .row { padding: 0.2rem 0; border-bottom: 1px solid #2a2d36; font-family: ui-monospace, monospace; font-size: 0.9rem; }
  .hp { font-weight: bold; }
  #status { margin: 1rem 0; font-size: 1.05rem; }
</style>
</head>
<body>
  <h1>Cat Board Game — Combat &amp; PvP Turn Prototype (isolated demo)</h1>
  <p>Auto-plays a battle with no player input, for a quick sanity check of combat.js/pvpTurns.js in isolation. See <a href="index.html" style="color:#9fc5ff">index.html</a> for the full interactive vertical slice (board + movement + proximity + alliances + PvP).</p>
  <div id="status">Not started.</div>
  <button id="runBtn">Run simulated battle</button>
  <div id="log"></div>

<script type="module">
  import { computeDamage } from "./combat.js";
  import { PvpBattle } from "./pvpTurns.js";

  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");

  function line(text) {
    const div = document.createElement("div");
    div.className = "row";
    div.textContent = text;
    logEl.appendChild(div);
  }

  document.getElementById("runBtn").addEventListener("click", () => {
    logEl.innerHTML = "";
    const cardValues = {
      attack: [8, 8, 9, 9, 10, 10, 11, 11, 12, 12],
      guard: [4, 4, 5, 5, 6, 6, 7, 7, 8, 8],
    };

    const battle = new PvpBattle({
      initiatorId: "Whiskers",
      opponentId: "Mittens",
      initiatorStats: { attack: 18, defense: 10 },
      opponentStats: { attack: 14, defense: 14 },
      cardValues,
    });

    line(`Battle start: ${battle.attackerId} (attacker) vs ${battle.defenderId} (defender)`);
    line(`Sanity check computeDamage(20,10,8,3) = ${computeDamage(20, 10, 8, 3)} (expect 19)`);
    line(`Sanity check floor: computeDamage(5,0,50,10) = ${computeDamage(5, 0, 50, 10)} (expect 1)`);

    let rounds = 0;
    while (battle.phase !== "finished" && rounds < 200) {
      rounds++;
      battle.drawPhase();

      const attacker = battle.attacker;
      const defender = battle.defender;
      const attackCard = attacker.hand.find((c) => c.type === "attack");
      if (!attackCard) { line(`${attacker.id} has no attack card in hand — skipping turn`); battle.phase = "end"; battle.endPhase(); continue; }

      battle.playAttack(attackCard.id);
      const guardCard = defender.hand.find((c) => c.type === "guard");
      battle.respondGuard(guardCard ? guardCard.id : null);

      const last = battle.log[battle.log.length - 1];
      line(`Round ${rounds}: ${last.attackerId} plays ${last.attackCard} -> ${last.defenderId} ${last.guardCard ? "guards with " + last.guardCard : "no guard"} | damage ${last.damage} | ${last.defenderId} HP -> ${last.defenderHpAfter}`);

      if (battle.phase === "finished") break;
      battle.endPhase();
    }

    if (battle.winnerId) {
      statusEl.innerHTML = `<strong>${battle.winnerId} wins</strong> after ${rounds} rounds. Final HP — ${Object.values(battle.players).map(p => `${p.id}: <span class="hp">${p.hp}</span>`).join(", ")}`;
    } else {
      statusEl.textContent = `Battle ended without a winner after ${rounds} rounds (unexpected in this demo).`;
    }
  });
</script>
</body>
</html>
